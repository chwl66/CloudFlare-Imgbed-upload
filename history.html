<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>上传记录</title>
  <style>
    body {
      width: 720px;
      min-height: 480px;
      margin: 0;
      padding: 14px 16px 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #1f2937;
      box-sizing: border-box;
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      animation: history-fade-in 0.2s ease;
    }

    @keyframes history-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    *, *::before, *::after {
      box-sizing: inherit;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .header .title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35);
    }

    .header-icon svg {
      width: 15px;
      height: 15px;
    }

    .header h2 {
      margin: 0;
      font-size: 16px;
      color: #334155;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .summary {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .search-input {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 13px;
      background: #fff;
      color: #1f2937;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input::placeholder {
      color: #9ca3af;
    }

    .search-input:focus {
      outline: none;
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
    }

    .filters {
      display: flex;
      gap: 6px;
    }

    .chip {
      padding: 5px 10px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      background: #fff;
      color: #555;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      background: #e9e9e9;
    }

    .chip.active {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35);
    }

    .btn {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .btn-danger.confirming {
      background: #dc2626;
      color: #fff;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #fff;
      border: 1px solid #e9ecef;
      border-left: 3px solid #10b981;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .item:hover {
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      transform: translateY(-1px);
    }

    .item.failed {
      border-left-color: #ef4444;
    }

    .thumb {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 6px;
      background: #e9ecef;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .main {
      flex: 1;
      min-width: 0;
    }

    .item-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .name {
      font-weight: 600;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .badge {
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 11px;
      background: #e2e8f0;
      color: #475569;
      white-space: nowrap;
    }

    .badge.state-success {
      background: #d1fae5;
      color: #047857;
    }

    .badge.state-failed {
      background: #fee2e2;
      color: #b91c1c;
    }

    .time {
      font-size: 11px;
      color: #666;
      white-space: nowrap;
    }

    .url {
      display: block;
      font-family: Consolas, Monaco, monospace;
      font-size: 11px;
      color: #0b5394;
      background: rgba(0, 0, 0, 0.05);
      padding: 4px 6px;
      border-radius: 3px;
      word-break: break-all;
      margin-bottom: 6px;
    }

    .error-text {
      font-size: 12px;
      color: #b91c1c;
      background: rgba(239, 68, 68, 0.08);
      padding: 4px 6px;
      border-radius: 3px;
      word-break: break-word;
      margin-bottom: 6px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .actions .btn {
      padding: 4px 8px;
    }

    .btn.copied {
      background: #10b981;
      color: #fff;
    }

    .empty {
      padding: 40px 0;
      text-align: center;
      color: #888;
      font-size: 13px;
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        color: #e2e8f0;
      }

      .header h2,
      .name {
        color: #e2e8f0;
      }

      .summary,
      .time {
        color: #94a3b8;
      }

      .search-input {
        background: #334155;
        border-color: #475569;
        color: #e2e8f0;
      }

      .search-input::placeholder {
        color: #64748b;
      }

      .search-input:focus {
        border-color: #0ea5e9;
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
      }

      .chip,
      .btn-secondary {
        background: #334155;
        border-color: #475569;
        color: #e2e8f0;
      }

      .chip:hover,
      .btn-secondary:hover {
        background: #475569;
      }

      .chip.active {
        background: linear-gradient(135deg, #0ea5e9, #0284c7);
        border-color: transparent;
        color: #fff;
        box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35);
      }

      .btn-danger {
        background: #7f1d1d;
        color: #fecaca;
      }

      .btn-danger:hover {
        background: #991b1b;
      }

      .item {
        background: #334155;
        border-color: #475569;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      .item:hover {
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
      }

      .thumb,
      .url {
        background: #1e293b;
      }

      .url {
        color: #7dd3fc;
      }

      .error-text {
        color: #fca5a5;
      }

      .badge {
        background: #475569;
        color: #cbd5e1;
      }

      .badge.state-success {
        background: #064e3b;
        color: #6ee7b7;
      }

      .badge.state-failed {
        background: #7f1d1d;
        color: #fecaca;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
      </div>
      <h2>上传记录</h2>
    </div>
    <div class="header-actions">
      <span id="summary" class="summary"></span>
      <button type="button" id="clearBtn" class="btn btn-danger">清空记录</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="search" id="searchInput" class="search-input" placeholder="搜索文件名、链接或错误信息">
    <div class="filters" id="filters">
      <button type="button" class="chip active" data-filter="all">全部</button>
      <button type="button" class="chip" data-filter="success">成功</button>
      <button type="button" class="chip" data-filter="failed">失败</button>
    </div>
  </div>

  <div id="list" class="list"></div>
  <div id="empty" class="empty">暂无上传记录</div>

  <script src="utils.js"></script>
  <script src="history-store.js"></script>
  <script src="history.js"></script>
</body>
</html>
