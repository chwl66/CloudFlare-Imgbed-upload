<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>上传记录</title>
  <style>
    body {
      width: 720px;
      min-height: 480px;
      margin: 0;
      padding: 18px 20px 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: inherit;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .header h2 {
      margin: 0;
      font-size: 17px;
      color: #333;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .summary {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .search-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }

    .search-input:focus {
      outline: none;
      border-color: #007acc;
      box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.2);
    }

    .filters {
      display: flex;
      gap: 6px;
    }

    .chip {
      padding: 6px 12px;
      border: 1px solid #ddd;
      border-radius: 14px;
      background: #f3f3f3;
      color: #555;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      background: #e9e9e9;
    }

    .chip.active {
      background: #007acc;
      border-color: #007acc;
      color: #fff;
    }

    .btn {
      padding: 7px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    .btn-secondary {
      background: #f3f3f3;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e9e9e9;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .btn-danger.confirming {
      background: #dc2626;
      color: #fff;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-left: 3px solid #10b981;
      border-radius: 6px;
    }

    .item.failed {
      border-left-color: #ef4444;
    }

    .thumb {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      border-radius: 4px;
      background: #e9ecef;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .main {
      flex: 1;
      min-width: 0;
    }

    .item-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .name {
      font-weight: 600;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .badge {
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 11px;
      background: #e2e8f0;
      color: #475569;
      white-space: nowrap;
    }

    .badge.state-success {
      background: #d1fae5;
      color: #047857;
    }

    .badge.state-failed {
      background: #fee2e2;
      color: #b91c1c;
    }

    .time {
      font-size: 11px;
      color: #666;
      white-space: nowrap;
    }

    .url {
      display: block;
      font-family: Consolas, Monaco, monospace;
      font-size: 11px;
      color: #0b5394;
      background: rgba(0, 0, 0, 0.05);
      padding: 5px 7px;
      border-radius: 3px;
      word-break: break-all;
      margin-bottom: 8px;
    }

    .error-text {
      font-size: 12px;
      color: #b91c1c;
      background: rgba(239, 68, 68, 0.08);
      padding: 5px 7px;
      border-radius: 3px;
      word-break: break-word;
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .actions .btn {
      padding: 5px 10px;
    }

    .btn.copied {
      background: #10b981;
      color: #fff;
    }

    .empty {
      padding: 60px 0;
      text-align: center;
      color: #888;
      font-size: 13px;
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1e293b;
        color: #e2e8f0;
      }

      .header h2,
      .name {
        color: #e2e8f0;
      }

      .summary,
      .time {
        color: #94a3b8;
      }

      .search-input {
        background: #334155;
        border-color: #475569;
        color: #e2e8f0;
      }

      .search-input:focus {
        border-color: #0ea5e9;
        box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
      }

      .chip,
      .btn-secondary {
        background: #334155;
        border-color: #475569;
        color: #e2e8f0;
      }

      .chip:hover,
      .btn-secondary:hover {
        background: #475569;
      }

      .chip.active {
        background: #0284c7;
        border-color: #0284c7;
        color: #fff;
      }

      .btn-danger {
        background: #7f1d1d;
        color: #fecaca;
      }

      .btn-danger:hover {
        background: #991b1b;
      }

      .item {
        background: #334155;
        border-color: #475569;
      }

      .thumb,
      .url {
        background: #1e293b;
      }

      .url {
        color: #7dd3fc;
      }

      .error-text {
        color: #fca5a5;
      }

      .badge {
        background: #475569;
        color: #cbd5e1;
      }

      .badge.state-success {
        background: #064e3b;
        color: #6ee7b7;
      }

      .badge.state-failed {
        background: #7f1d1d;
        color: #fecaca;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>上传记录</h2>
    <div class="header-actions">
      <span id="summary" class="summary"></span>
      <button type="button" id="clearBtn" class="btn btn-danger">清空记录</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="search" id="searchInput" class="search-input" placeholder="搜索文件名、链接或错误信息">
    <div class="filters" id="filters">
      <button type="button" class="chip active" data-filter="all">全部</button>
      <button type="button" class="chip" data-filter="success">成功</button>
      <button type="button" class="chip" data-filter="failed">失败</button>
    </div>
  </div>

  <div id="list" class="list"></div>
  <div id="empty" class="empty">暂无上传记录</div>

  <script src="utils.js"></script>
  <script src="history-store.js"></script>
  <script src="history.js"></script>
</body>
</html>
