<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>图床文件</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      width: 860px;
      min-height: 560px;
      padding: 16px 18px 20px;
      font-size: 13px;
    }

    *, *::before, *::after {
      box-sizing: inherit;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .header .title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h2 {
      margin: 0;
      font-size: 16px;
      color: #334155;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .summary {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .search-input {
      flex: 1;
      padding: 8px 12px;
    }

    .btn {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .btn-danger.confirming {
      background: #dc2626;
      color: #fff;
    }

    .btn.copied {
      background: #10b981;
      color: #fff;
    }

    .btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      padding: 9px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      display: none;
      word-break: break-word;
    }

    .status.error {
      display: block;
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      display: block;
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .item:hover {
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      transform: translateY(-1px);
    }

    .thumb {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 6px;
      background: #e9ecef;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #64748b;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .main {
      flex: 1;
      min-width: 0;
    }

    .name {
      font-weight: 600;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
      margin-bottom: 3px;
    }

    .meta {
      font-size: 11px;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .actions .btn {
      padding: 5px 10px;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
      font-size: 12px;
      color: #475569;
    }

    .empty {
      padding: 44px 0;
      text-align: center;
      color: #888;
      font-size: 13px;
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      .header h2,
      .name {
        color: #e2e8f0;
      }

      .summary,
      .meta,
      .pager {
        color: #94a3b8;
      }

      .item {
        background: #334155;
        border-color: #475569;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      .item:hover {
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
      }

      .thumb {
        background: #1e293b;
        color: #94a3b8;
      }

      .btn-danger {
        background: #7f1d1d;
        color: #fecaca;
      }

      .btn-danger:hover {
        background: #991b1b;
      }

      .status.error {
        background-color: #7f1d1d;
        color: #fecaca;
        border-color: #991b1b;
      }

      .status.info {
        background-color: #164e63;
        color: #cffafe;
        border-color: #155e75;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </div>
      <h2>图床文件</h2>
    </div>
    <div class="header-actions">
      <span id="summary" class="summary"></span>
      <button type="button" id="refreshBtn" class="btn btn-secondary">刷新</button>
    </div>
  </div>

  <div id="status" class="status"></div>

  <div class="toolbar">
    <input type="search" id="searchInput" class="search-input" placeholder="按文件名搜索（服务端搜索）">
    <button type="button" id="searchBtn" class="btn btn-secondary">搜索</button>
  </div>

  <div id="list" class="list"></div>
  <div id="empty" class="empty">暂无文件</div>

  <div class="pager">
    <button type="button" id="prevBtn" class="btn btn-secondary">上一页</button>
    <span id="pageInfo">第 1 页</span>
    <button type="button" id="nextBtn" class="btn btn-secondary">下一页</button>
  </div>

  <script src="utils.js"></script>
  <script src="config.js"></script>
  <script src="manage.js"></script>
</body>
</html>
